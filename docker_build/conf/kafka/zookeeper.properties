# ZooKeeper config for the ranga-kafka image, which serves both roles.
#
# cp-kafka ships zookeeper-server-start and the ZooKeeper jars but no properties
# template - only kafka.properties.template - so the ZooKeeper side needs this file
# rather than the ZOOKEEPER_* environment variables cp-zookeeper understood.
dataDir=/var/lib/zookeeper/data
dataLogDir=/var/lib/zookeeper/log
clientPort=2181
tickTime=2000
initLimit=5
syncLimit=2
maxClientCnxns=0

# Four-letter words are denied by default, which makes "ruok" - the standard liveness
# probe, and what demos/e2e_test.sh uses - answer "not in the whitelist".
4lw.commands.whitelist=ruok,srvr,stat,conf

# No embedded admin server: it binds 8080, which collides with the Spark master.
admin.enableServer=false
