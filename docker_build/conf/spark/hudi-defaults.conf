# Default properties applied to every Hudi job.
#
# Hudi locates this file via the HUDI_CONF_DIR environment variable, falling back to
# /etc/hudi/conf. Dropping it in $SPARK_CONF alone does nothing: Spark never passes it
# to Hudi. Dockerfile.spark installs it under /etc/hudi/conf and sets HUDI_CONF_DIR.

# Hive sync goes straight to the metastore over thrift. Do not use the legacy
# use_jdbc/jdbcurl pair: hive_sync.mode supersedes it, and HMS mode is what the rest of
# this stack expects (the Hudi Streamer properties under docker_run/hudi_streamer and the
# Trino hudi catalog both point at the same thrift endpoint).
hoodie.datasource.hive_sync.mode hms
hoodie.datasource.hive_sync.metastore.uris thrift://hive-metastore:9083
hoodie.datasource.hive_sync.support_timestamp true

hoodie.index.type BLOOM
hoodie.metadata.enable true
hoodie.datasource.write.table.type COPY_ON_WRITE

# Small values suited to a single-worker local cluster, not to production sizing.
hoodie.upsert.shuffle.parallelism 8
hoodie.insert.shuffle.parallelism 8
hoodie.delete.shuffle.parallelism 8
hoodie.bulkinsert.shuffle.parallelism 8
