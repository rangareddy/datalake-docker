services:
  zookeeper:
    # Same image as the broker. cp-kafka already ships zookeeper-server-start and the
    # ZooKeeper jars, so a separate cp-zookeeper image was 825MB of duplicate content.
    # What it does not ship is a ZooKeeper properties template - /etc/confluent/docker
    # holds only kafka's - so the config is baked into ranga-kafka at
    # /etc/kafka/zookeeper.properties, and the upstream entrypoint, which only knows how
    # to start a broker, is replaced here. The ZOOKEEPER_* environment variables that
    # cp-zookeeper understood are in that file instead.
    image: rangareddy1988/ranga-kafka:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: zookeeper
    restart: unless-stopped
    entrypoint: ["zookeeper-server-start"]
    command: ["/etc/kafka/zookeeper.properties"]
    ports:
      - "2181:2181"
    healthcheck:
      test: nc -z localhost 2181 || exit 1
      start_period: 20s
      start_interval: 10s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

  kafka:
    image: rangareddy1988/ranga-kafka:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 10000000
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
    ports:
      - "29092:29092"
      - "9092:9092"
      - "9101:9101"
    healthcheck:
      test: nc -z localhost 9092 || exit 1
      start_period: 20s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

  kafka-schema-registry:
    image: rangareddy1988/ranga-kafka-schema-registry:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: kafka-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: "kafka-schema-registry"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:29092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: "INFO"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: "_schemas"
      SCHEMA_REGISTRY_DEBUG: "true"
    ports:
      - "8081:8081"
    healthcheck:
      test: nc -z localhost 8081 || exit 1
      # 20s was not enough on a fully loaded "all" profile: the registry reads its
      # _schemas topic from the beginning before it binds, and was still starting
      # after two minutes. An unhealthy registry then blocks kafka-ui at start.
      start_period: 120s
      start_interval: 10s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

  kafka-rest:
    image: rangareddy1988/ranga-kafka-rest:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: kafka-rest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_REST_SCHEMA_REGISTRY_URL: "http://kafka-schema-registry:8081"
      KAFKA_REST_HOST_NAME: "kafka-rest"
      KAFKA_REST_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_REST_LISTENERS: "http://0.0.0.0:8082"
    ports:
      - "8082:8082"
    healthcheck:
      test: nc -z localhost 8082 || exit 1
      start_period: 120s
      start_interval: 10s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

  kafka-connect:
    image: rangareddy1988/ranga-kafka-connect:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: kafka-connect
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-rest:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:29092"
      CONNECT_GROUP_ID: "kafka-connect-group"
      CONNECT_LISTENERS: "http://0.0.0.0:8083"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_REST_PORT: 8083
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://kafka-schema-registry:8081"
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_LOG4J_ROOT_LOGLEVEL: "INFO"
      CONNECT_LOG4J_LOGGERS: "org.apache.kafka.connect.runtime.rest=WARN,org.apache.zookeeper=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components,/opt/connectors"
      # Connect defaults to -Xmx2G, and on the "all" profile that is what tips the
      # Docker VM over: the kernel OOM-kills it (docker events shows "oom", exit 137),
      # restart: unless-stopped brings it back, and it dies again part-way through the
      # plugin scan - a loop that looks like a slow start rather than a memory problem.
      # 1G is comfortable for this plugin set.
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx1024M"
    ports:
      - "8083:8083"
    volumes:
      - ./debezium_configs:/opt/data/connector_configs
    healthcheck:
      test: nc -z localhost 8083 || exit 1
      # Connect scans every plugin jar before it binds 8083. Measured at 112s on an
      # idle machine, against a budget of start_period + retries*interval = 170s - too
      # little margin when the whole stack starts at once and competes for I/O.
      # kafka-ui used to wait on this being healthy and so vanished whenever Connect
      # lost that race; it now waits only for the container to start, so a slow
      # Connect costs a temporarily empty connector list rather than a missing UI.
      start_period: 300s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

  kafka-ui:
    image: rangareddy1988/ranga-kafka-ui:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      # Both of these are service_started for the same reason; see below.
      kafka-schema-registry:
        condition: service_started
      # service_started, not service_healthy. Compose evaluates depends_on once at
      # start, and Connect scans every plugin jar before it binds 8083 - measured at
      # 112s idle and far longer under the "all" profile. Waiting for healthy meant
      # kafka-ui was never started at all: Created, no logs, no UI, and nothing
      # pointing at Connect as the cause. kafka-ui does not need Connect to be up; it
      # shows the connector list as unavailable until Connect answers, then recovers.
      kafka-connect:
        condition: service_started
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://kafka-schema-registry:8081
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: first
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      KAFKA_CLUSTERS_0_AUDIT_TOPICAUDITENABLED: "true"
      KAFKA_CLUSTERS_0_AUDIT_CONSOLEAUDITENABLED: "true"
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "9082:8080"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider  http://localhost:8080/actuator/health
      start_period: 20s
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - datalake

  hive-metastore:
    image: rangareddy1988/ranga-hive:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: hive-metastore
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_DRIVER: postgres
      SERVICE_NAME: "metastore"
      VERBOSE: "true"
    ports:
      - "9083:9083"
    volumes:
      - ./logs/metastore/:/tmp/hive/
    healthcheck:
      test: bash -c "exec 6<> /dev/tcp/localhost/9083"
      start_period: 50s
      start_interval: 20s
      interval: 50s
      timeout: 30s
      retries: 10
    networks:
      - datalake

  hive-server:
    image: rangareddy1988/ranga-hive:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: hive-server
    restart: unless-stopped
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      HIVE_SERVER2_THRIFT_PORT: 10000
      SERVICE_OPTS: "-Dhive.metastore.uris=thrift://hive-metastore:9083"
      AWS_ACCESS_KEY: admin
      AWS_SECRET_ACCESS_KEY: password
    volumes:
      - ./logs/hiveserver/:/tmp/hive/
    ports:
      - "10000:10000"
      - "10002:10002"
    healthcheck:
      # HiveServer2 had no healthcheck, so it reported no status at all and nothing
      # could depend on it being ready. 10000 is the Thrift/JDBC port beeline uses.
      # 180s of grace: it waits on the metastore, then initialises its own session
      # manager, and 60s was not enough once the "all" profile was competing for CPU.
      test: bash -c "exec 6<> /dev/tcp/localhost/10000"
      start_period: 180s
      start_interval: 15s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

  spark-master:
    image: rangareddy1988/${SPARK_IMAGE:-ranga-spark}:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: spark-master
    restart: unless-stopped
    user: root
    depends_on:
      hive-metastore:
        condition: service_healthy
    env_file:
      - aws.env
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
      - "14040-14042:4040-4042"
      - "18080:18080"
    volumes:
      - ./data/spark-events:/opt/spark/spark-events
      - ./logs/spark-master:/var/log/spark
      - ./hudi_streamer:/opt/hudi_streamer
      # Mounted rather than "docker cp"-ed, so demos/e2e_test.sh always exercises the
      # working tree and a fix to a demo needs no copy step to take effect.
      - ../demos:/opt/demos:ro
    healthcheck:
      test: bash -c "exec 6<> /dev/tcp/localhost/8080"
      start_period: 20s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

  spark-worker:
    image: rangareddy1988/${SPARK_IMAGE:-ranga-spark}:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: spark-worker
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    env_file:
      - aws.env
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_HOST=spark-master
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "18081:8081"
    volumes:
      - ./logs/spark-worker:/var/log/spark
    healthcheck:
      test: bash -c "exec 6<> /dev/tcp/localhost/8081"
      start_period: 20s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

  postgres:
    image: rangareddy1988/ranga-postgres:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./db_scripts/postgres/db_init.sql:/docker-entrypoint-initdb.d/1_db_init.sql
      - ./db_scripts/postgres/employees.sql:/docker-entrypoint-initdb.d/2_employees.sql
      - ./db_scripts/postgres/multi_table_data.sql:/docker-entrypoint-initdb.d/3_data.sql
      - ./data/postgres:/var/lib/postgresql/data
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD", "psql", "-U", "postgres", "-c", "SELECT 1"]
      start_period: 20s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

  minio:
    image: rangareddy1988/ranga-minio:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      # MinIO's own liveness endpoint, not a bare TCP probe: an open port only says
      # the process bound it, while /minio/health/live says the object store is
      # actually serving. ranga-minio also declares this as a HEALTHCHECK, so a
      # plain "docker run" of the image reports the same thing.
      test: curl -fsS http://localhost:9000/minio/health/live || exit 1
      start_period: 20s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      datalake:
        aliases:
          - warehouse.minio

  mc:
    # The MinIO server image already contains the mc client at /usr/bin/mc, so there is
    # no separate client image: this is ranga-minio with a different entrypoint.
    image: rangareddy1988/ranga-minio:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: mc
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - aws.env
    entrypoint: >
      /bin/sh -c " 
      until (/usr/bin/mc alias set minio http://minio:9000 admin password) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing minio/warehouse;
      /usr/bin/mc mb --ignore-existing minio/datalake;
      /usr/bin/mc anonymous set public minio/warehouse;
      /usr/bin/mc anonymous set public minio/datalake;
      tail -f /dev/null
      "
    healthcheck:
      # ranga-minio declares a HEALTHCHECK against the MinIO server's /minio/health/live.
      # This container runs the client, not the server, so that probe would fail forever
      # and report a working sidecar as unhealthy.
      disable: true
    networks:
      - datalake

networks:
  datalake:
    name: datalake
